name: Pull Request Check Pipeline
on:
    pull_request:
        branches:
            - master
jobs:
    test-linux:
        name: Test (Linux)
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: read
            checks: write
            id-token: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Initialize submodules
                uses: snickerbockers/submodules-init@v4
            -   name: Set up project
                run: chmod +x ./setup.sh && ./setup.sh
            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.12' 
            -   name: Install report generator
                run: dotnet tool install --global dotnet-reportgenerator-globaltool
            -   name: Run tests and verify coverage
                run: python script/run_test.py -e linux -c
    test-windows:
        name: Test (Windows)
        runs-on: windows-latest
        permissions:
            pull-requests: write
            contents: read
            checks: write
            id-token: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Initialize submodules
                uses: snickerbockers/submodules-init@v4
            -   name: Setup cmake
                uses: jwlawson/actions-setup-cmake@v2
                with:
                    cmake-version: '4.3.1'
            -   name: Set up project
                run: ./setup.ps1
            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.12' 
            -   name: Install report generator
                run: dotnet tool install --global dotnet-reportgenerator-globaltool
            -   name: Run tests and verify coverage
                run: python script/run_test.py -e linux -c
    codestyle:
        name: Check codestyle
        runs-on: windows-latest
        permissions:
            pull-requests: write
            contents: read
            checks: write
            id-token: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Initialize submodules
                uses: snickerbockers/submodules-init@v4
            -   name: Setup cmake
                uses: jwlawson/actions-setup-cmake@v2
                with:
                    cmake-version: '4.3.1'
            -   name: Set up project
                run: ./setup.ps1
            -   name: Configure project
                run: |
                    cd Konna.Kernel `
                    ; cmake --preset konna-kernel-release-win
            -   name: Run clang-format
                run: |
                    cd Konna.Kernel `
                    ; Get-ChildItem -Path .\src\Konna\ -Recurse -File | Where-Object { $_.FullName -match '\.(cpp|h)$' } | ` 
                    ForEach-Object { .\..\setup\llvm\bin\clang-format.exe -i --style=file $_.FullName --dry-run --Werror}    
    lint:
        name: Check lint
        runs-on: windows-latest
        permissions:
            pull-requests: write
            contents: read
            checks: write
            id-token: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Initialize submodules
                uses: snickerbockers/submodules-init@v4
            -   name: Setup cmake
                uses: jwlawson/actions-setup-cmake@v2
                with:
                    cmake-version: '4.3.1'
            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.13' 
            -   name: Set up project
                run: ./setup.ps1
            -   name: Configure project
                run: |
                    cd Konna.Kernel `
                    ; cmake --preset konna-kernel-release-win
            -   name: Run clang-tidy
                run: |
                    cd Konna.Kernel `
                    ; python .\..\setup\llvm\bin\run-clang-tidy -clang-tidy-binary .\..\setup\llvm\bin\clang-tidy.exe `
                        -p build\win\release ".*\\(test|src)\\Konna\\.*\.(c|cpp|h|hpp)$"   
