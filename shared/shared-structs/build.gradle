plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

ext {
    artifactId = "konna.shared-structs"
}

description = "Konna engine structures (collections, vectors, etc.)"

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation "org.jspecify:jspecify:1.0.0"

    implementation project(":annotations-core")
    implementation project(":shared-exceptions")

    compileOnly 'org.jetbrains:annotations:26.0.2-1'
    testCompileOnly 'org.jetbrains:annotations:26.0.2-1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(":testing")
    testImplementation project(":core")
    testImplementation project(":implementations-std-core")
}

sourceSets {
    test {
        resources {
            exclude '**/*.class'
            exclude 'build/classes/**'
        }
    }
}
